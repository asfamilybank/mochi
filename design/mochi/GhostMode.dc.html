<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  svg { display: block; }
  body { margin: 0; }
</style>
</helmet>
<div style="width:1440px;height:900px;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,sans-serif;background:{{desktopBg}};">

  <!-- the app the user is actually focused on: sharp and prominent -->
  <div style="position:absolute;left:180px;top:120px;width:760px;height:560px;border-radius:12px;overflow:hidden;background:{{bgWinFill}};border:1px solid {{bgWinBorder}};backdrop-filter:blur(16px) saturate(160%);box-shadow:0 30px 60px rgba(0,0,0,.3);z-index:1;">
    <div style="height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid {{hairline}};">
      <span style="width:11px;height:11px;border-radius:50%;background:#FF5F57;"></span>
      <span style="width:11px;height:11px;border-radius:50%;background:#FFBD2E;"></span>
      <span style="width:11px;height:11px;border-radius:50%;background:#28C840;"></span>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;padding:28px;">
      <div style="width:60%;height:14px;border-radius:4px;background:{{iconMuted}};"></div>
      <div style="width:85%;height:14px;border-radius:4px;background:{{iconMuted}};"></div>
      <div style="width:40%;height:14px;border-radius:4px;background:{{iconMuted}};"></div>
      <div style="width:70%;height:14px;border-radius:4px;background:{{iconMuted}};"></div>
      <div style="width:50%;height:14px;border-radius:4px;background:{{iconMuted}};"></div>
    </div>
  </div>

  <!-- dock -->
  <div style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end;padding:8px 12px;border-radius:20px;background:{{dockFill}};backdrop-filter:blur(20px) saturate(180%);border:1px solid {{toolbarBorder}};box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:2;">
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#6EE7B7,#059669);"></div>
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#93C5FD,#2563EB);"></div>
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#FDE68A,#D97706);"></div>
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#FCA5A5,#DC2626);"></div>
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#C4B5FD,#7C3AED);"></div>
  </div>

  <!-- Mochi widget: Ghost Mode, no chrome at all, faded to target opacity -->
  <div style="position:absolute;left:1020px;top:520px;width:320px;height:180px;border-radius:14px;overflow:hidden;opacity:{{contentOpacity}};box-shadow:{{ghostShadow}};z-index:5;">
    <div style="position:relative;width:100%;height:100%;background:linear-gradient(160deg,#111114,#000);display:flex;align-items:center;justify-content:center;">
      <div style="position:absolute;inset:-20%;background:radial-gradient(circle at 50% 40%, {{accentGlow}}, transparent 60%);opacity:.35;"></div>
      <div style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 6.5v11l9-5.5-9-5.5z" fill="#fff"/></svg>
      </div>
      <div style="position:absolute;left:14px;right:14px;bottom:14px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);">
        <div style="width:38%;height:100%;border-radius:2px;background:{{accent}};"></div>
      </div>
    </div>
  </div>

  <!-- cursor + passthrough hint: mouse is over the widget's screen area, the window vanishes on hover -->
  <div style="position:absolute;left:1180px;top:610px;z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:4px;">
    <svg width="22" height="22" viewBox="0 0 24 24" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));"><path d="M5 3l0 16.5 4-3.6 2.6 6 2.4-1-2.6-6h5.6z" fill="#fff" stroke="#000" stroke-width="0.6"/></svg>
    <div style="background:rgba(0,0,0,0.55);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px;white-space:nowrap;">鼠标移入 → 整个窗口消失</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{
  "dark": {"editor":"boolean","default":true,"section":"外观"},
  "accent": {"editor":"color","default":"#FF9500","options":["#FF9500","#007AFF","#AF52DE","#FF375F","#FF3B30","#34C759","#8E8E93"],"section":"外观"},
  "opacity": {"editor":"range","default":35,"min":10,"max":90,"step":5,"unit":"%","section":"Ghost Mode"}
}'>
class Component extends DCLogic {
  hex2rgba(hex, a) {
    var h = hex.replace('#', '');
    var full = h.length === 3 ? h.split('').map(function (c) { return c + c; }).join('') : h;
    var n = parseInt(full, 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  renderVals() {
    var dark = !!this.props.dark;
    var accent = this.props.accent || '#FF9500';
    var opacity = (this.props.opacity != null ? this.props.opacity : 35) / 100;
    var shadowAlpha = Math.max(0.04, Math.min(0.45, opacity * 0.5));
    return {
      dark: dark,
      accent: accent,
      contentOpacity: opacity,
      ghostShadow: '0 ' + Math.round(20 * opacity + 6) + 'px ' + Math.round(40 * opacity + 10) + 'px rgba(0,0,0,' + shadowAlpha.toFixed(2) + ')',
      iconMuted: dark ? 'rgba(245,245,247,0.28)' : 'rgba(29,29,31,0.24)',
      toolbarBorder: dark ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.6)',
      hairline: dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)',
      dockFill: dark ? 'rgba(30,30,34,0.55)' : 'rgba(255,255,255,0.45)',
      bgWinFill: dark ? 'rgba(60,60,64,0.55)' : 'rgba(255,255,255,0.6)',
      bgWinBorder: dark ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.6)',
      desktopBg: dark
        ? 'radial-gradient(1100px 760px at 12% 18%, oklch(46% 0.12 250), transparent 60%), radial-gradient(950px 680px at 88% 12%, oklch(42% 0.14 20), transparent 55%), radial-gradient(1300px 860px at 50% 105%, oklch(32% 0.10 300), transparent 65%), linear-gradient(180deg, oklch(19% 0.015 260), oklch(11% 0.015 260))'
        : 'radial-gradient(1100px 760px at 12% 18%, oklch(88% 0.07 250), transparent 60%), radial-gradient(950px 680px at 88% 12%, oklch(86% 0.08 20), transparent 55%), radial-gradient(1300px 860px at 50% 105%, oklch(82% 0.06 300), transparent 65%), linear-gradient(180deg, oklch(95% 0.01 260), oklch(91% 0.012 260))',
      accentGlow: this.hex2rgba(accent, 0.5)
    };
  }
}
</script>
</body>
</html>
