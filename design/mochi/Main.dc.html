<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  svg { display: block; }
  body { margin: 0; }
</style>
</helmet>
<div style="width:1440px;height:900px;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,sans-serif;background:{{desktopBg}};">

  <!-- background: another app window (where the user's focus actually is) -->
  <div style="position:absolute;left:60px;top:580px;width:400px;height:250px;border-radius:12px;overflow:hidden;background:{{bgWinFill}};border:1px solid {{bgWinBorder}};backdrop-filter:blur(16px) saturate(160%);box-shadow:0 20px 40px rgba(0,0,0,.25);z-index:1;">
    <div style="height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid {{hairline}};">
      <span style="width:9px;height:9px;border-radius:50%;background:rgba(255,95,87,.7);"></span>
      <span style="width:9px;height:9px;border-radius:50%;background:rgba(255,189,46,.7);"></span>
      <span style="width:9px;height:9px;border-radius:50%;background:rgba(40,200,64,.7);"></span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;padding:16px;">
      <div style="width:70%;height:10px;border-radius:4px;background:{{iconMuted}};"></div>
      <div style="width:90%;height:10px;border-radius:4px;background:{{iconMuted}};"></div>
      <div style="width:55%;height:10px;border-radius:4px;background:{{iconMuted}};"></div>
      <div style="width:80%;height:10px;border-radius:4px;background:{{iconMuted}};"></div>
    </div>
  </div>

  <!-- dock -->
  <div style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end;padding:8px 12px;border-radius:20px;background:{{dockFill}};backdrop-filter:blur(20px) saturate(180%);border:1px solid {{toolbarBorder}};box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:2;">
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#6EE7B7,#059669);"></div>
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#93C5FD,#2563EB);"></div>
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#FDE68A,#D97706);"></div>
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#FCA5A5,#DC2626);"></div>
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#C4B5FD,#7C3AED);"></div>
  </div>

  <!-- Mochi widget window: Normal Mode -->
  <div style="position:absolute;left:400px;top:170px;width:640px;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -10px rgba(0,0,0,.45),0 10px 20px rgba(0,0,0,.25);z-index:5;">

    <!-- native title bar -->
    <div style="height:38px;position:relative;display:flex;align-items:center;background:{{titlebarFill}};backdrop-filter:blur(30px) saturate(180%);border-bottom:1px solid {{hairline}};">
      <div style="position:absolute;left:12px;display:flex;gap:8px;align-items:center;">
        <span style="width:12px;height:12px;border-radius:50%;background:#FF5F57;"></span>
        <span style="width:12px;height:12px;border-radius:50%;background:#FFBD2E;"></span>
        <span style="width:12px;height:12px;border-radius:50%;background:#28C840;"></span>
      </div>
      <div style="flex:1;text-align:center;font-size:13px;font-weight:600;color:{{textPrimary}};">Mochi</div>
    </div>

    <!-- custom Liquid Glass toolbar -->
    <div style="padding:8px 10px;background:{{titlebarFill}};">
      <div style="display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:16px;background:{{toolbarFill}};backdrop-filter:blur(24px) saturate(180%);border:1px solid {{toolbarBorder}};box-shadow:inset 0 1px 0 {{toolbarHighlight}},0 1px 2px rgba(0,0,0,.08);">

        <!-- back -->
        <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:{{iconColor}};">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <!-- forward (no history yet) -->
        <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:{{iconMuted}};">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <!-- refresh -->
        <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:{{iconColor}};">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 2.5 5.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 17v-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>

        <!-- address field -->
        <div style="flex:1;height:30px;margin:0 4px;border-radius:9px;background:{{fieldFill}};display:flex;align-items:center;gap:6px;padding:0 10px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="color:{{textSecondary}};flex-shrink:0;"><rect x="6" y="10" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" stroke="currentColor" stroke-width="1.6"/></svg>
          <span style="font-size:12.5px;color:{{fieldText}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">example.com/watch/live-session-42</span>
        </div>

        <!-- pin -->
        <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:{{pinIcon}};background:{{pinBg}};border:1px solid {{pinBorder}};">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <g transform="rotate(45 12 12)">
              <rect x="9" y="3" width="6" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <line x1="12" y1="12" x2="12" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
        <!-- ghost mode toggle (inactive: we're in Normal Mode) -->
        <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:{{iconColor}};">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M5 19V11a7 7 0 0 1 14 0V19q-1.75 -2.5 -3.5 0 q-1.75 -2.5 -3.5 0 q-1.75 -2.5 -3.5 0 q-1.75 -2.5 -3.5 0 Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <circle cx="9.3" cy="11.5" r="1" fill="currentColor" stroke="none"/>
            <circle cx="14.7" cy="11.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <!-- more / settings -->
        <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:{{iconColor}};">
          <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg>
        </div>
      </div>
    </div>

    <!-- content: mock video player -->
    <div style="height:360px;position:relative;background:linear-gradient(160deg,#111114,#000);overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="position:absolute;inset:-20%;background:radial-gradient(circle at 50% 40%, {{accentGlow}}, transparent 60%);opacity:.35;"></div>
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M9 6.5v11l9-5.5-9-5.5z" fill="#fff"/></svg>
      </div>
      <div style="position:absolute;left:16px;bottom:36px;display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.75);">
        <span style="width:6px;height:6px;border-radius:50%;background:#FF3B30;"></span>
        示例视频 · 正在播放
      </div>
      <div style="position:absolute;left:16px;right:16px;bottom:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);">
        <div style="width:38%;height:100%;border-radius:2px;background:{{accent}};"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{
  "dark": {"editor":"boolean","default":false,"section":"外观"},
  "accent": {"editor":"color","default":"#FF9500","options":["#FF9500","#007AFF","#AF52DE","#FF375F","#FF3B30","#34C759","#8E8E93"],"section":"外观"},
  "pinned": {"editor":"boolean","default":true,"section":"状态"}
}'>
class Component extends DCLogic {
  hex2rgba(hex, a) {
    var h = hex.replace('#', '');
    var full = h.length === 3 ? h.split('').map(function (c) { return c + c; }).join('') : h;
    var n = parseInt(full, 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  renderVals() {
    var dark = !!this.props.dark;
    var accent = this.props.accent || '#FF9500';
    var pinned = this.props.pinned !== false;
    return {
      dark: dark,
      accent: accent,
      textPrimary: dark ? '#F5F5F7' : '#1D1D1F',
      textSecondary: dark ? 'rgba(235,235,245,0.65)' : 'rgba(60,60,67,0.6)',
      iconColor: dark ? 'rgba(245,245,247,0.9)' : 'rgba(29,29,31,0.82)',
      iconMuted: dark ? 'rgba(245,245,247,0.28)' : 'rgba(29,29,31,0.24)',
      titlebarFill: dark ? 'rgba(28,28,32,0.72)' : 'rgba(248,248,250,0.72)',
      toolbarFill: dark ? 'rgba(44,44,48,0.55)' : 'rgba(255,255,255,0.55)',
      toolbarBorder: dark ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.6)',
      toolbarHighlight: dark ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.85)',
      hairline: dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)',
      fieldFill: dark ? 'rgba(0,0,0,0.25)' : 'rgba(0,0,0,0.045)',
      fieldText: dark ? 'rgba(245,245,247,0.85)' : 'rgba(29,29,31,0.75)',
      dockFill: dark ? 'rgba(30,30,34,0.55)' : 'rgba(255,255,255,0.45)',
      bgWinFill: dark ? 'rgba(60,60,64,0.4)' : 'rgba(255,255,255,0.4)',
      bgWinBorder: dark ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.5)',
      desktopBg: dark
        ? 'radial-gradient(1100px 760px at 12% 18%, oklch(46% 0.12 250), transparent 60%), radial-gradient(950px 680px at 88% 12%, oklch(42% 0.14 20), transparent 55%), radial-gradient(1300px 860px at 50% 105%, oklch(32% 0.10 300), transparent 65%), linear-gradient(180deg, oklch(19% 0.015 260), oklch(11% 0.015 260))'
        : 'radial-gradient(1100px 760px at 12% 18%, oklch(88% 0.07 250), transparent 60%), radial-gradient(950px 680px at 88% 12%, oklch(86% 0.08 20), transparent 55%), radial-gradient(1300px 860px at 50% 105%, oklch(82% 0.06 300), transparent 65%), linear-gradient(180deg, oklch(95% 0.01 260), oklch(91% 0.012 260))',
      accentGlow: this.hex2rgba(accent, 0.5),
      pinBg: pinned ? this.hex2rgba(accent, 0.18) : 'transparent',
      pinBorder: pinned ? this.hex2rgba(accent, 0.45) : 'transparent',
      pinIcon: pinned ? accent : (dark ? 'rgba(245,245,247,0.9)' : 'rgba(29,29,31,0.82)')
    };
  }
}
</script>
</body>
</html>
